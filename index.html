<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cream: #f5f0e8;
  --card-white: #fffef9;
  --ink: #2a2118;
  --ink-light: #6b5d4f;
  --accent: #c4553a;
  --accent-warm: #d4764e;
  --green: #4a7c59;
  --green-light: #e8f0e4;
  --shadow-card: 0 2px 8px rgba(42,33,24,0.12), 0 1px 3px rgba(42,33,24,0.08);
  --shadow-card-hover: 0 8px 25px rgba(42,33,24,0.18), 0 3px 8px rgba(42,33,24,0.1);
  --shadow-card-lifted: 0 20px 40px rgba(42,33,24,0.22), 0 8px 16px rgba(42,33,24,0.12);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(196,85,58,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(74,124,89,0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Noise texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.3;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 320px;
  min-height: 100vh;
}

.main {
  padding: 48px 56px;
  max-width: 960px;
}

/* Header */
.header {
  margin-bottom: 48px;
}

.header h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 42px;
  letter-spacing: -0.5px;
  color: var(--ink);
  line-height: 1.1;
}

.header h1 span {
  color: var(--accent);
  font-style: italic;
  font-weight: 400;
}

.header p {
  margin-top: 8px;
  color: var(--ink-light);
  font-size: 15px;
  letter-spacing: 0.2px;
}

/* Section labels */
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--ink-light);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(42,33,24,0.12);
}

/* Recipe Deck */
.deck-area {
  margin-bottom: 56px;
}

.deck-container {
  position: relative;
  display: flex;
  gap: 0;
  padding: 20px 0;
  min-height: 240px;
}

.recipe-card {
  position: relative;
  width: 200px;
  min-width: 200px;
  height: 200px;
  background: var(--card-white);
  border-radius: 12px;
  padding: 24px 20px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(42,33,24,0.06);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  user-select: none;
  margin-left: -24px;
}

.recipe-card:first-child {
  margin-left: 0;
}

.recipe-card::before {
  content: '';
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(196,85,58,0.08);
  transition: all 0.3s ease;
}

.recipe-card:hover {
  transform: translateY(-16px) rotate(-1deg);
  box-shadow: var(--shadow-card-hover);
  z-index: 10;
  margin-left: -8px;
  margin-right: 16px;
}

.recipe-card:first-child:hover {
  margin-left: 0;
}

.recipe-card.active {
  transform: translateY(-24px) rotate(0deg) scale(1.03);
  box-shadow: var(--shadow-card-lifted);
  z-index: 20;
  border-color: var(--accent);
  margin-left: -8px;
  margin-right: 16px;
}

.recipe-card.active::before {
  background: var(--accent);
  transform: scale(1.2);
}

.recipe-card:first-child.active {
  margin-left: 0;
}

.recipe-card .card-emoji {
  font-size: 28px;
  line-height: 1;
  margin-bottom: 4px;
}

.recipe-card .card-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--ink);
}

.recipe-card .card-desc {
  font-size: 12px;
  color: var(--ink-light);
  line-height: 1.4;
  margin-top: 4px;
}

.recipe-card .card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-light);
}

.recipe-card .card-meta .time {
  display: flex;
  align-items: center;
  gap: 4px;
}

.recipe-card .card-meta .servings {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Ingredient Cards Area */
.ingredients-area {
  min-height: 100px;
}

.ingredients-container {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 0;
}

.ingredient-card {
  background: var(--card-white);
  border-radius: 10px;
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(42,33,24,0.06);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0;
  transform: translateY(20px) rotate(2deg);
  min-width: 180px;
  user-select: none;
}

.ingredient-card.visible {
  opacity: 1;
  transform: translateY(0) rotate(0deg);
}

.ingredient-card:hover {
  transform: translateY(-4px) rotate(-0.5deg);
  box-shadow: var(--shadow-card-hover);
}

.ingredient-card.added {
  border-color: var(--green);
  background: var(--green-light);
}

.ingredient-card .ing-qty {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  white-space: nowrap;
  min-width: 50px;
}

.ingredient-card.added .ing-qty {
  color: var(--green);
}

.ingredient-card .ing-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}

.ingredient-card .ing-add {
  margin-left: auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid rgba(42,33,24,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--ink-light);
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.ingredient-card:hover .ing-add {
  border-color: var(--accent);
  color: var(--accent);
}

.ingredient-card.added .ing-add {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-light);
  font-size: 14px;
  font-style: italic;
}

.empty-state .arrow-hint {
  font-size: 28px;
  margin-bottom: 8px;
  opacity: 0.4;
}

/* Shopping List Sidebar */
.sidebar {
  background: var(--ink);
  color: var(--cream);
  padding: 48px 28px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  margin-bottom: 32px;
}

.sidebar-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--cream);
  margin-bottom: 4px;
}

.sidebar-header .item-count {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: rgba(245,240,232,0.5);
  letter-spacing: 1px;
}

.shopping-list {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.shopping-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  transition: all 0.3s ease;
  animation: slideInRight 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.shopping-item:hover {
  background: rgba(245,240,232,0.06);
}

.shopping-item .si-check {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid rgba(245,240,232,0.25);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.shopping-item .si-check:hover {
  border-color: var(--accent);
}

.shopping-item.checked .si-check {
  background: var(--green);
  border-color: var(--green);
}

.shopping-item.checked .si-check::after {
  content: '✓';
  font-size: 11px;
  color: white;
}

.shopping-item.checked .si-text {
  text-decoration: line-through;
  opacity: 0.4;
}

.shopping-item .si-qty {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--accent-warm);
  min-width: 50px;
}

.shopping-item .si-text {
  font-size: 14px;
  color: rgba(245,240,232,0.85);
  transition: all 0.2s ease;
}

.shopping-item .si-remove {
  margin-left: auto;
  background: none;
  border: none;
  color: rgba(245,240,232,0.2);
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.2s ease;
  opacity: 0;
}

.shopping-item:hover .si-remove {
  opacity: 1;
}

.shopping-item .si-remove:hover {
  color: var(--accent);
  background: rgba(196,85,58,0.15);
}

.sidebar-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: rgba(245,240,232,0.3);
  font-size: 13px;
  gap: 8px;
}

.sidebar-empty .bag-icon {
  font-size: 36px;
  opacity: 0.4;
  margin-bottom: 4px;
}

.sidebar-actions {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(245,240,232,0.08);
  display: flex;
  gap: 8px;
}

.btn {
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
  flex: 1;
  text-align: center;
}

.btn-clear {
  background: rgba(245,240,232,0.08);
  color: rgba(245,240,232,0.6);
}

.btn-clear:hover {
  background: rgba(196,85,58,0.2);
  color: var(--accent-warm);
}

.btn-add-all {
  background: var(--green);
  color: white;
}

.btn-add-all:hover {
  background: #5a8c69;
  transform: translateY(-1px);
}

/* Scrollbar styling for sidebar */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(245,240,232,0.15); border-radius: 2px; }
</style>
</head>
<body>

<div class="app">
  <div class="main">
    <div class="header">
      <h1>Recipe <span>Deck</span></h1>
      <p>Pull a card to reveal its ingredients. Add what you need to your list.</p>
    </div>

    <div class="deck-area">
      <div class="section-label">Recipe Cards</div>
      <div class="deck-container" id="deckContainer"></div>
    </div>

    <div class="ingredients-area">
      <div class="section-label">Ingredients</div>
      <div id="ingredientsContainer">
        <div class="empty-state">
          <div class="arrow-hint">↑</div>
          Pull a recipe card to see its ingredients
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Shopping List</h2>
      <div class="item-count" id="itemCount">0 items</div>
    </div>
    <div class="shopping-list" id="shoppingList">
      <div class="sidebar-empty" id="sidebarEmpty">
        <div class="bag-icon">🛒</div>
        <div>Your list is empty</div>
        <div style="font-size:11px;opacity:0.6;">Click ingredients to add them</div>
      </div>
    </div>
    <div class="sidebar-actions" id="sidebarActions" style="display:none;">
      <button class="btn btn-clear" onclick="clearList()">Clear All</button>
      <button class="btn btn-add-all" onclick="addAllIngredients()">+ Add All</button>
    </div>
  </div>
</div>

<script>
const recipes = [
  {
    id: 1, emoji: '🍝', name: 'Spaghetti Bolognese', desc: 'Rich, slow-simmered meat sauce on al dente pasta', time: '45 min', servings: 4,
    ingredients: [
      { name: 'Spaghetti', qty: '400g' },
      { name: 'Ground Beef', qty: '500g' },
      { name: 'Onion', qty: '1 large' },
      { name: 'Garlic', qty: '3 cloves' },
      { name: 'Crushed Tomatoes', qty: '400g' },
      { name: 'Tomato Paste', qty: '2 tbsp' },
      { name: 'Parmesan', qty: '50g' },
      { name: 'Olive Oil', qty: '2 tbsp' },
    ]
  },
  {
    id: 2, emoji: '🥘', name: 'Chicken Stir Fry', desc: 'Quick wok-tossed chicken with crisp vegetables', time: '20 min', servings: 3,
    ingredients: [
      { name: 'Chicken Breast', qty: '500g' },
      { name: 'Bell Pepper', qty: '2 whole' },
      { name: 'Broccoli', qty: '1 head' },
      { name: 'Soy Sauce', qty: '3 tbsp' },
      { name: 'Ginger', qty: '1 inch' },
      { name: 'Garlic', qty: '2 cloves' },
      { name: 'Sesame Oil', qty: '1 tbsp' },
      { name: 'Rice', qty: '300g' },
    ]
  },
  {
    id: 3, emoji: '🥗', name: 'Caesar Salad', desc: 'Crisp romaine, garlicky croutons, tangy dressing', time: '15 min', servings: 2,
    ingredients: [
      { name: 'Romaine Lettuce', qty: '2 heads' },
      { name: 'Parmesan', qty: '60g' },
      { name: 'Bread', qty: '2 slices' },
      { name: 'Anchovy Fillets', qty: '4 pcs' },
      { name: 'Egg Yolk', qty: '1 large' },
      { name: 'Lemon', qty: '1 whole' },
      { name: 'Garlic', qty: '2 cloves' },
      { name: 'Olive Oil', qty: '4 tbsp' },
    ]
  },
  {
    id: 4, emoji: '🥞', name: 'Fluffy Pancakes', desc: 'Golden buttermilk pancakes with maple syrup', time: '25 min', servings: 4,
    ingredients: [
      { name: 'All-Purpose Flour', qty: '200g' },
      { name: 'Buttermilk', qty: '300ml' },
      { name: 'Eggs', qty: '2 large' },
      { name: 'Butter', qty: '30g' },
      { name: 'Baking Powder', qty: '2 tsp' },
      { name: 'Sugar', qty: '2 tbsp' },
      { name: 'Maple Syrup', qty: '120ml' },
    ]
  },
  {
    id: 5, emoji: '🌮', name: 'Beef Tacos', desc: 'Spiced ground beef with fresh toppings in corn shells', time: '30 min', servings: 4,
    ingredients: [
      { name: 'Ground Beef', qty: '500g' },
      { name: 'Taco Shells', qty: '8 pcs' },
      { name: 'Onion', qty: '1 medium' },
      { name: 'Tomato', qty: '2 whole' },
      { name: 'Lettuce', qty: '1/2 head' },
      { name: 'Cheddar Cheese', qty: '100g' },
      { name: 'Sour Cream', qty: '120ml' },
      { name: 'Cumin', qty: '1 tbsp' },
      { name: 'Lime', qty: '2 whole' },
    ]
  },
  {
    id: 6, emoji: '🍲', name: 'Tomato Soup', desc: 'Velvety roasted tomato soup with fresh basil', time: '40 min', servings: 4,
    ingredients: [
      { name: 'Tomatoes', qty: '1 kg' },
      { name: 'Onion', qty: '1 large' },
      { name: 'Garlic', qty: '4 cloves' },
      { name: 'Vegetable Broth', qty: '500ml' },
      { name: 'Heavy Cream', qty: '100ml' },
      { name: 'Fresh Basil', qty: '1 bunch' },
      { name: 'Olive Oil', qty: '3 tbsp' },
    ]
  },
  {
    id: 7, emoji: '🧀', name: 'Grilled Cheese', desc: 'Buttery, golden-crusted with melty cheese layers', time: '10 min', servings: 2,
    ingredients: [
      { name: 'Sourdough Bread', qty: '4 slices' },
      { name: 'Cheddar Cheese', qty: '120g' },
      { name: 'Gruyère Cheese', qty: '80g' },
      { name: 'Butter', qty: '40g' },
      { name: 'Dijon Mustard', qty: '1 tsp' },
    ]
  },
  {
    id: 8, emoji: '🥩', name: 'Beef Stew', desc: 'Hearty chunks of beef braised with root vegetables', time: '2 hrs', servings: 6,
    ingredients: [
      { name: 'Beef Chuck', qty: '800g' },
      { name: 'Potatoes', qty: '4 medium' },
      { name: 'Carrots', qty: '3 large' },
      { name: 'Onion', qty: '2 medium' },
      { name: 'Beef Broth', qty: '750ml' },
      { name: 'Tomato Paste', qty: '2 tbsp' },
      { name: 'Flour', qty: '3 tbsp' },
      { name: 'Thyme', qty: '3 sprigs' },
      { name: 'Red Wine', qty: '200ml' },
    ]
  },
];

let activeRecipe = null;
let shoppingList = [];

function renderDeck() {
  const container = document.getElementById('deckContainer');
  container.innerHTML = '';
  recipes.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'recipe-card' + (activeRecipe === r.id ? ' active' : '');
    card.style.zIndex = i;
    card.style.transform += ` rotate(${(i - 3.5) * 1.2}deg)`;
    card.onclick = () => selectRecipe(r.id);
    card.innerHTML = `
      <div>
        <div class="card-emoji">${r.emoji}</div>
        <div class="card-title">${r.name}</div>
        <div class="card-desc">${r.desc}</div>
      </div>
      <div class="card-meta">
        <span class="time">⏱ ${r.time}</span>
        <span class="servings">👤 ${r.servings}</span>
      </div>
    `;
    container.appendChild(card);
  });
}

function selectRecipe(id) {
  if (activeRecipe === id) {
    activeRecipe = null;
    renderDeck();
    document.getElementById('ingredientsContainer').innerHTML = `
      <div class="empty-state">
        <div class="arrow-hint">↑</div>
        Pull a recipe card to see its ingredients
      </div>`;
    return;
  }
  activeRecipe = id;
  renderDeck();
  renderIngredients(id);
}

function renderIngredients(recipeId) {
  const recipe = recipes.find(r => r.id === recipeId);
  const container = document.getElementById('ingredientsContainer');
  const wrapper = document.createElement('div');
  wrapper.className = 'ingredients-container';

  recipe.ingredients.forEach((ing, i) => {
    const isAdded = shoppingList.some(s => s.name === ing.name && s.qty === ing.qty);
    const card = document.createElement('div');
    card.className = 'ingredient-card' + (isAdded ? ' added' : '');
    card.onclick = () => toggleIngredient(ing, recipeId);
    card.innerHTML = `
      <span class="ing-qty">${ing.qty}</span>
      <span class="ing-name">${ing.name}</span>
      <span class="ing-add">${isAdded ? '✓' : '+'}</span>
    `;
    // Staggered animation
    setTimeout(() => card.classList.add('visible'), 60 * i);
    wrapper.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(wrapper);
}

function toggleIngredient(ing, recipeId) {
  const idx = shoppingList.findIndex(s => s.name === ing.name && s.qty === ing.qty);
  if (idx > -1) {
    shoppingList.splice(idx, 1);
  } else {
    shoppingList.push({ ...ing });
  }
  renderIngredients(recipeId);
  renderShoppingList();
}

function addAllIngredients() {
  if (!activeRecipe) return;
  const recipe = recipes.find(r => r.id === activeRecipe);
  recipe.ingredients.forEach(ing => {
    if (!shoppingList.some(s => s.name === ing.name && s.qty === ing.qty)) {
      shoppingList.push({ ...ing });
    }
  });
  renderIngredients(activeRecipe);
  renderShoppingList();
}

function clearList() {
  shoppingList = [];
  if (activeRecipe) renderIngredients(activeRecipe);
  renderShoppingList();
}

function removeItem(index) {
  shoppingList.splice(index, 1);
  if (activeRecipe) renderIngredients(activeRecipe);
  renderShoppingList();
}

function toggleCheck(index) {
  shoppingList[index].checked = !shoppingList[index].checked;
  renderShoppingList();
}

function renderShoppingList() {
  const container = document.getElementById('shoppingList');
  const empty = document.getElementById('sidebarEmpty');
  const actions = document.getElementById('sidebarActions');
  const countEl = document.getElementById('itemCount');

  countEl.textContent = shoppingList.length + ' item' + (shoppingList.length !== 1 ? 's' : '');

  if (shoppingList.length === 0) {
    container.innerHTML = `
      <div class="sidebar-empty">
        <div class="bag-icon">🛒</div>
        <div>Your list is empty</div>
        <div style="font-size:11px;opacity:0.6;">Click ingredients to add them</div>
      </div>`;
    actions.style.display = 'none';
    return;
  }

  actions.style.display = 'flex';
  container.innerHTML = '';
  shoppingList.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'shopping-item' + (item.checked ? ' checked' : '');
    el.innerHTML = `
      <div class="si-check" onclick="toggleCheck(${i})"></div>
      <span class="si-qty">${item.qty}</span>
      <span class="si-text">${item.name}</span>
      <button class="si-remove" onclick="removeItem(${i})">×</button>
    `;
    container.appendChild(el);
  });
}

renderDeck();
</script>

</body>
</html>
